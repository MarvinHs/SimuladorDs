plugins {
    id 'com.android.application'
}

// Datos de la app. El dominio debe coincidir con el sitio publicado y con
// /.well-known/assetlinks.json del sitio.
def twaHost = 'simuladords.onrender.com'

android {
    namespace 'com.marvinhs.simuladorvisa'
    compileSdk 36

    defaultConfig {
        applicationId 'com.marvinhs.simuladorvisa'
        minSdk 23
        targetSdk 36
        // GitHub Actions pasa un número creciente en cada compilación
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName "1.0.${System.getenv('VERSION_CODE') ?: '0'}"

        manifestPlaceholders = [
            hostName: twaHost,
            launchUrl: "https://${twaHost}/?source=android"
        ]
        resValue 'string', 'asset_statements',
            """[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"https://${twaHost}"}}]"""
    }

    signingConfigs {
        release {
            // La llave NUNCA se guarda en el repositorio: llega por secretos de GitHub
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues true
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
