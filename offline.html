<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e3a8a">
    <title>Sin conexión | Simulador de Entrevista de Visa</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; text-align: center; padding: 24px; box-sizing: border-box; }
        img { width: 96px; height: 96px; border-radius: 22px; }
        h1 { font-size: 1.4rem; color: #1e3a8a; margin: 18px 0 8px; }
        p { color: #64748b; max-width: 360px; margin: 0 auto 20px; line-height: 1.5; }
        button { background: #1e3a8a; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 1rem; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img src="/assets/icons/icon-192.png" alt="">
        <h1>Sin conexión a internet</h1>
        <p>El cónsul necesita internet para hacerte la entrevista. Revisa tu conexión y vuelve a intentarlo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
