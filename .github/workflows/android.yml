name: App Android (Google Play)

# Compila la app de Android (Trusted Web Activity) que abre el simulador.
# - Siempre genera un APK de prueba (debug) para instalar en tu teléfono.
# - Si existen los secretos de firma, genera además el AAB firmado para
#   subir a Google Play y el APK firmado.
# Los archivos quedan en la pestaña "Releases" del repositorio.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Preparar llave de firma
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Faltan los secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD: solo se generará el APK de prueba."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK de prueba
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Compilar AAB y APK firmados
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Reunir archivos
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/SimuladorVisa-${VERSION_CODE}-prueba.apk"
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/SimuladorVisa-${VERSION_CODE}-play.aab"
            cp android/app/build/outputs/apk/release/app-release.apk "dist/SimuladorVisa-${VERSION_CODE}.apk"
          fi
          ls -la dist

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: App Android 1.0.${{ github.run_number }}
          body: |
            Compilación automática de la app de Android.

            - **SimuladorVisa-…-play.aab** → el archivo para subir a Google Play Console.
            - **SimuladorVisa-….apk** → APK firmado para instalar directamente en un teléfono.
            - **SimuladorVisa-…-prueba.apk** → APK de prueba (debug).

            Si solo aparece el APK de prueba, faltan los secretos de firma (ver README).
          files: dist/*
          prerelease: ${{ steps.keystore.outputs.signed != 'true' }}
